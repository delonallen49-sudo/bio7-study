<style>
/* Study mode: the lecture fills the second screen; OneNote stays focused on the main screen */
:root{--bg:#f4f7fb;--surface:#fff;--fg:#1b2533;--muted:#5d6b7c;--line:#d6dee8;--accent:#1f5fa8;--accent-fg:#fff;--now:#fff6d6;--now-line:#e0b93b}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,"Segoe UI",sans-serif}
main{max-width:1500px;margin:0 auto;padding:10px 16px 40px;display:grid;gap:10px}
h1{font-size:18px;margin:0}
.sub{color:var(--muted);font-size:13px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:12px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
video{width:100%;max-height:78vh;background:#000;border-radius:8px;display:block}
.now{background:var(--now);border:1px solid var(--now-line);border-radius:8px;padding:10px 12px;min-width:0}
.now .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.now b{display:block;font-size:16px;margin:2px 0 6px}
.now p{margin:0;font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,a.btn{font:600 14px system-ui,"Segoe UI",sans-serif;padding:7px 12px;border-radius:6px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer;text-decoration:none}
button.primary,button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
button:focus-visible,a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tip{font-size:13px;color:var(--muted)}
kbd{font:600 12px ui-monospace,Consolas,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.slide img{width:100%;display:block;border-radius:4px}
.slide b{display:block;font-size:13px;margin-top:4px}
.slide span{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.slide:hover,.slide:focus-visible{border-color:var(--accent);outline:none}
.slide.cur{background:var(--now);border-color:var(--now-line)}
</style>
</head>

meristem; each to its primary tissue; then vascular cambium to secondary xylem and phloem, and cork cambium to cork (periderm).", "img/35.5_002.jpg": "", "img/35.5_005.jpg": "", "img/36.1_003.jpg": "Draw a tree with roots. Label H2O and minerals entering roots, CO2 entering and O2 and H2O leaving leaves, light, xylem (roots to shoots) and phloem (sugar from leaves to where it is needed).", "img/36.2_004.jpg": "Draw three cells in a row. Label cell wall, cytosol, plasma membrane and plasmodesma, then draw three arrows: apoplastic route along the walls, symplastic route through cytosol and plasmodesmata, transmembrane route crossing each membrane.", "img/36.2_005.jpg": "Draw a membrane with a proton pump. Label cytoplasm (negative side), extracellular fluid (positive side), ATP, and H+ moving out.", "img/36.2_006.jpg": "Draw a membrane with a cotransporter. Show H+ moving in down its gradient together with sucrose (S) or NO3-; label H+/sucrose cotransporter.", "img/36.2_007.jpg": "", "img/36.2_012.jpg": "Draw a plant cell in a beaker of concentrated solution with arrows of water leaving and the protoplast pulled away from the wall. Label cell wall, protoplast, plasma membrane, and water moving out.", "img/36.2_014.jpg": "", "img/36.2_015.jpg": "Draw a plant cell in a beaker of pure water with arrows of water entering and the protoplast pressed against the wall. Label cell wall, protoplast, water moving in, turgor pressure.", "img/36.2_016.jpg": "", "img/36.2_017.jpg": "", "img/36.2_019.jpg": "", "img/36.3_008.jpg": "Draw a root cross section strip: root hair, epidermis, cortex, endodermis with Casparian strip, vascular cylinder with xylem vessel. Draw the apoplastic route stopped at the Casparian strip and crossing into an endodermal cell, and the symplastic route through plasmodesmata.", "img/36.3_012.jpg": "", "img/36.3_019.jpg": "Draw a tree with three insets: leaf (mesophyll cells, stoma, transpiration), stem xylem (water chain with cohesion and adhesion to cell wall), root (root hair, soil particle, water uptake). Add an arrow labeled water potential gradient from soil (high) to air (low).", "img/36.3_028.jpg": "", "img/36.3_036.jpg": "", "img/36.3_045.jpg": "", "img/36.4_003.jpg": "Draw a stoma between two bean-shaped guard cells among epidermal cells; label stoma, guard cell, epidermal cell.", "img/36.5-36.6_007.jpg": "", "img/36.5-36.6_010.jpg": "", "img/36.5-36.6_011.jpg": "Draw a membrane with a proton pump (ATP, H+ pumped out) and an H+/sucrose cotransporter (H+ and sucrose moving in together). Label high and low H+ concentration.", "img/36.5-36.6_013.jpg": "Draw a xylem vessel beside a sieve tube, a source cell (leaf) at the top and a sink cell (storage root) at the bottom. Number and label: 1 loading of sugar and uptake of water, 2 positive pressure forces sap to flow, 3 unloading of sugar, 4 recycling of water; arrows: bulk flow by positive pressure (phloem, down) and by negative pressure (xylem, up).", "img/36.5-36.6_016.jpg": "", "img/37.1_003.jpg": "Draw a soil profile with three stacked layers; label the A horizon (topsoil and humus), B horizon (less organic matter, less weathered) and C horizon (partially broken down rock).", "img/37.1_004.jpg": "", "img/37.2_007.jpg": "", "img/37.2_008.jpg": "", "img/37.3_003.jpg": "", "img/37.3_009.jpg": "", "img/37.3_010.jpg": "", "img/37.3_014.jpg": "Draw a legume root system with round swellings along the roots; label roots and nodules, and note that nodules hold <i>Rhizobium<\/i> bacteria that fix nitrogen.", "img/37.3_017.jpg": "Draw a cross section of root cells: label epidermis, cortex, endodermis, the mantle (fungal sheath) on the outside, and fungal hyphae running between cortical cells but not entering them.", "img/37.3_018.jpg": "Draw root cortex cells with fungal hyphae entering from the soil; label epidermis, cortex, endodermis, fungal hyphae, fungal vesicle, arbuscules, and the plasma membrane pushed in around each arbuscule. Draw no mantle.", "img/37.3_022.jpg": "", "img/37.3_023.jpg": "", "img/37.3_024.jpg": "", "img/37.3_027.jpg": "", "img/38.1A_005.jpg": "Draw a flower in side view. Label sepal, petal, receptacle, stamen (anther, filament) and carpel (stigma, style, ovary, ovule).", "img/38.1A_010.jpg": "Draw a simple ovary cross section with one chamber and a compound ovary cross section with three chambers; label ovule and carpel chamber.", "img/38.1A_014.jpg": "", "img/38.1A_015.jpg": "", "img/38.1A_016.jpg": "", "img/38.1A_017.jpg": "", "img/38.1A_018.jpg": "", "img/38.1A_019.jpg": "", "img/38.1B_017.jpg": "Draw the cycle with haploid (n) and diploid (2n) phases. Label mature flower (2n), microsporangia, microsporocyte (2n), meiosis, four microspores (n), pollen grain (generative cell, tube cell), megasporangium (2n), four megaspores (n), integuments, micropyle, embryo sac (antipodal cells, polar nuclei in central cell, synergids, egg), stigma, pollen tube, two sperm, fertilization, zygote (2n), endosperm nucleus (3n), seed: embryo (2n), endosperm (3n), seed coat (2n), germinating seed.", "img/38.1B_029.jpg": "Draw the ovule with the pollen tube entering. Label pollen tube, zygote (2n), endosperm nucleus (3n).", "img/38.1B_037.jpg": "Draw an opened bean seed. Label seed coat, cotyledons, epicotyl, hypocotyl, radicle (and plumule).", "img/38.1B_042.jpg": "Draw stages of bean germination left to right. Label seed coat, radicle, hypocotyl (hook), cotyledons, epicotyl, foliage leaves.", "img/38.1C_002.jpg": "", "img/38.1C_003.jpg": "Draw a four-column table: flower and resulting fruit for pea, raspberry, pineapple, apple. Label carpel, ovary, stamen, receptacle, and the fruit type for each.", "img/38.1C_008.jpg": "", "img/38.1C_009.jpg": "", "img/38.1C_010.jpg": "", "img/38.2_003.jpg": "", "img/38.2_006.jpg": "", "img/38.2_007.jpg": "Draw two tubular flowers side by side: thrum (stamens above stigma) and pin (stigma above stamens). Label stamens and styles.", "img/38.3_002.jpg": "", "img/38.3_009.jpg": "", "img/38.3_011.jpg": ""};
const Q = new URLSearchParams(location.search);
const c = Q.get("v") || "35.1", start = +(Q.get("t") || 0);
const v = document.getElementById("v"), list = ALL[c] || [];
const store = {get(k, d) { try { const x = localStorage.getItem("player:" + k); return x === null ? d : JSON.parse(x); } catch (e) { return d; } },
               set(k, x) { try { localStorage.setItem("player:" + k, JSON.stringify(x)); } catch (e) {} }};
v.src = "video/" + c + ".mp4";
document.getElementById("title").textContent = "Bio 7 lecture " + c;
document.getElementById("sub").textContent = list.length ? list.length + " key slides: click one to jump there" : "";
const mmss = t => Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0");
const seek = d => { v.currentTime = Math.max(0, Math.min(v.duration || 1e9, v.currentTime + d)); };
const toggle = () => v.paused ? v.play() : v.pause();

// speed (remembered)
const setRate = r => { v.playbackRate = r; store.set("rate", r);
  document.querySelectorAll(".sp").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.r === r))); };
document.querySelectorAll(".sp").forEach(b => b.onclick = () => setRate(+b.dataset.r));

// auto-pause at each key slide (remembered): time to write before the next idea
const stopBtn = document.getElementById("stop");
let autoStop = !!store.get("autostop", false);
const showStop = () => stopBtn.setAttribute("aria-pressed", String(autoStop));
stopBtn.onclick = () => { autoStop = !autoStop; store.set("autostop", autoStop); showStop(); };
showStop();

v.addEventListener("loadedmetadata", () => { setRate(store.get("rate", 1)); if (start) v.currentTime = start; v.play().catch(() => {}); }, {once: true});

// slide list + "now explaining"
const box = document.getElementById("slides");
box.innerHTML = list.map((s, i) =>
  `<button class="slide" data-i="${i}" data-t="${s.t}"><img src="${s.img}" alt=""><b>${s.title}</b><span>&#9654; ${mmss(s.t)}</span></button>`).join("");
box.querySelectorAll(".slide").forEach(b => b.onclick = () => { v.currentTime = +b.dataset.t; v.play(); });
let cur = -2, lastT = 0;
v.addEventListener("timeupdate", () => {
  const t = v.currentTime;
  let i = -1; list.forEach((s, k) => { if (t >= s.t) i = k; });
  // crossing into a new key slide during normal playback (not a jump) pauses when auto-pause is on
  if (autoStop && !v.paused && i > cur && cur >= -1 && i >= 0 && t - lastT < 2 && t - list[i].t < 1.5) v.pause();
  lastT = t;
  if (i === cur) return;
  cur = i;
  box.querySelectorAll(".slide").forEach(b => b.classList.toggle("cur", +b.dataset.i === i));
  document.getElementById("nowt").textContent = i >= 0 ? "Slide " + (i + 1) + ". " + list[i].title : "Introduction";
  const d = i >= 0 ? (DRAW[list[i].img] || "") : "";
  document.getElementById("nowd").textContent = d ? "How to draw it: " + d : "";
  if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({
    title: i >= 0 ? list[i].title : "Lecture " + c, artist: "Bio 7 lecture " + c, album: "Bio 7"});
});

// control from OneNote: media keys and study_keys.pyw hotkeys arrive as media session actions
if ("mediaSession" in navigator) {
  const on = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
  on("play", () => v.play()); on("pause", () => v.pause());
  on("previoustrack", () => seek(-10)); on("nexttrack", () => seek(10));
  on("seekbackward", d => seek(-(d.seekOffset || 10))); on("seekforward", d => seek(d.seekOffset || 10));
}
document.getElementById("pip").onclick = async () => {
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture();
    else { await v.play().catch(() => {}); await v.requestPictureInPicture(); }
  } catch (e) { document.getElementById("pip").textContent = "Pop-out not supported here"; }
};
document.addEventListener("keydown", e => {
  const j = {ArrowLeft: -5, ArrowRight: 5}[e.key];
  if (j) { seek(j); e.preventDefault(); }
  if (e.key === " " && e.target === document.body) { toggle(); e.preventDefault(); }
  const rates = [1, 1.25, 1.5, 1.75], k = rates.indexOf(v.playbackRate);
  if (e.key === "]") setRate(rates[Math.min(rates.length - 1, k + 1)]);
  if (e.key === "[") setRate(rates[Math.max(0, k - 1)]);
});
</script>
